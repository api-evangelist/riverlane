aid: riverlane
name: Riverlane
description: >-
  Riverlane is a Cambridge (UK) quantum computing company building the quantum error correction (QEC)
  stack. Its two product lines are Deltaflow — a real-time QEC system covering qubit data readout,
  decoding, logical operations and orchestration, running error correction on up to 250 physical
  qubits with the proprietary Local Clustering Decoder — and Deltakit, an Apache-2.0 open-source
  Python SDK for designing, generating, simulating, decoding and analysing QEC experiments. The
  public developer surface is the Deltakit cloud service at https://deltakit.riverlane.com/proxy,
  a bearer-token API with two coexisting versions: a GraphQL endpoint (/api/graphql, API v1) and an
  asynchronous task REST API (/api/v2/tasks/add|get|kill, API v2). Both front Riverlane's proprietary
  decoders (Ambiguity Clustering, Local Clustering, Collision Clustering), leakage-aware decoding and
  simulation, iSWAP native-gate circuit generation, and stability-experiment generation. Riverlane
  publishes no OpenAPI or AsyncAPI document; the machine-readable contract is the open-source client
  library at github.com/Deltakit/deltakit, which is where every endpoint recorded in this profile
  was read from.
