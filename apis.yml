apis:
- name: Deltakit Cloud API
  description: >-
    Bearer-token cloud service backing the Deltakit SDK. Exposes the compute-heavy and proprietary
    parts of the QEC workflow that do not run locally: leakage noise generation and simulation,
    decoding with the Ambiguity Clustering (AC), Local Clustering (LCD) and Collision Clustering (CC)
    decoders, leakage-aware decoding, iSWAP native-gate circuit generation, quantum stability
    experiment generation, defect-rate and correlation-matrix analysis, and circuit/detector trimming.
    Two API versions share the same base URL and token: v1 is GraphQL (POST /api/graphql with query
    documents served from /api/data/query/<name>), v2 is an asynchronous REST task API (POST
    /api/v2/tasks/add/<task>, GET /api/v2/tasks/get/?request_id=, DELETE /api/v2/tasks/kill/).
  humanURL: https://deltakit.readthedocs.io/
  baseURL: https://deltakit.riverlane.com/proxy
