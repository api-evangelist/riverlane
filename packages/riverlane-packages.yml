notes: >-
  Riverlane ships one first-party client family, published to PyPI under the Deltakit name and
  developed in the open at github.com/Deltakit. `deltakit` is the meta-package; the rest are
  component packages. Only `deltakit-explorer` talks to the Deltakit Cloud API — the others are
  local compute. npm, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and crates.io were
  probed and carry no first-party Riverlane/Deltakit package (npm names `deltakit`,
  `@deltakit/circuit`, `patoka-circuit-js` all 404).
